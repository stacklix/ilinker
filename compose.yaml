services:
  ilinker:
    image: ghcr.io/stacklix/ilinker:latest
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
    volumes:
      - ilinker-data:/app/data
    stop_grace_period: 30s

volumes:
  ilinker-data:
